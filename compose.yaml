name: carewayv

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:?Set DB_PORT in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  api:
    image: carewayv-backend:local
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      PROJECT_NAME: ${PROJECT_NAME:-CareWayV}
      API_V1_PREFIX: ${API_V1_PREFIX:-}
      WAYFINDING_PREFIX: ${WAYFINDING_PREFIX:-}
      WAYFINDING_TAG: ${WAYFINDING_TAG:-}
      WAYFINDING_CACHE_CONTROL: ${WAYFINDING_CACHE_CONTROL:-}
      WAYFINDING_ERROR_STATUS: ${WAYFINDING_ERROR_STATUS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-openai/whisper-large-v3-turbo}
      OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL:-elevenlabs/eleven-flash-v2.5}
      OPENROUTER_TTS_VOICE: ${OPENROUTER_TTS_VOICE:-george}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v1}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      ELEVENLABS_REALTIME_MODEL: ${ELEVENLABS_REALTIME_MODEL:-scribe_v2_realtime}
      VOICE_END_SILENCE_SECS: ${VOICE_END_SILENCE_SECS:-0.5}
    command:
      - /bin/sh
      - -c
      - >-
        python -m alembic upgrade head &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${CAREWAYV_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    image: carewayv-frontend:local
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      WAYFINDING_PREFIX: ${WAYFINDING_PREFIX:-/wayfinding}
    ports:
      - "127.0.0.1:${CAREWAYV_FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
